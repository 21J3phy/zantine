# Model Pool config: API IDs, effort and prices (USD per 1M tokens).
# Source of truth for the numbers is docs/model-pool.md (checked 2026-10-20).
# Re-check every price before a paid run: the spend cap is only as good as these numbers.
#
# Fields:
#   provider            adapter that serves the model (see harness/provider.py)
#   effort              this run's effort level: low / medium / high (default medium;
#                       `zantine play --effort` or play_live(effort=...) overrides it)
#   efforts             effort level -> the lab's own setting, sent on the wire
#   input               uncached input
#   cached_input        input read from the prompt cache
#   cache_write         input written to the prompt cache (equal to `input` when the
#                       provider charges no write premium)
#   output              output tokens, including thinking tokens
#   max_output_tokens   per-call output cap (thinking + reply)
#   price_valid_until   optional; after this date the price is refused until updated
#   long_context        optional tier: when a call's prompt is over `above_input_tokens`,
#                       the whole call is billed at the tier's prices

[models."claude-fable-5-1"]
lab = "Anthropic"
provider = "anthropic"
effort = "medium"
efforts = { low = "low", medium = "medium", high = "high" }  # output_config.effort
input = 10.00
cached_input = 0.25
cache_write = 12.50   # 5-minute TTL write = 1.25x input
output = 50.00
max_output_tokens = 16000

