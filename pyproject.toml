[project]
name = "zantine"
version = "0.1.0"
description = "Among Us-style social-deduction benchmark for teams of AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "google-genai>=2.31",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=2",
]

[project.scripts]
zantine = "zantine.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls a paid model API; skipped unless ZANTINE_LIVE=1 and pytest --live",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zantine", "helpers", "fake_provider", "fake_providers"]
